<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>REFLECT / DODGE</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #040508; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: ui-monospace, Menlo, monospace; color: #cfd6ea; }
    #wrap { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
    #c { width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; }
    #touch { display: none; position: absolute; inset: 0; pointer-events: none; }
    @media (pointer: coarse) { #touch { display: block; } }
    #touch [data-btn] { pointer-events: auto; position: absolute; width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid rgba(200,220,255,0.25); background: rgba(200,220,255,0.06); touch-action: none; user-select: none;
      display: flex; align-items: center; justify-content: center; font-size: 18px; color: rgba(220,230,255,0.5); }
    body.editing { padding-right: 280px; box-sizing: border-box; }
    body.editing #wrap { width: min(calc(100vw - 296px), calc(100vh * 16 / 9)); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="touch">
      <div data-btn="U" style="left:72px;bottom:120px">▲</div>
      <div data-btn="L" style="left:16px;bottom:64px">◀</div>
      <div data-btn="R" style="left:128px;bottom:64px">▶</div>
      <div data-btn="D" style="left:72px;bottom:8px">▼</div>
      <div data-btn="JUMP" style="right:16px;bottom:24px">⤒</div>
      <div data-btn="REFLECT" style="right:84px;bottom:72px">◇</div>
      <div data-btn="reset" style="right:16px;top:16px;width:40px;height:40px">↺</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
